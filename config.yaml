# Telegram (secrets like API id/hash/session live in .env or GitHub Secrets)
telegram:
  source_chat: "" # numeric chat id of your dedicated "TikTok Queue" channel (see setup/list_telegram_chats.py)

# TikTok upload defaults
tiktok:
  mode: "draft" # draft = upload to your TikTok drafts, you tap Post in the app (works public today, no audit needed)
  #               direct = publish straight from the API (only private "Only me" until TikTok audits your app)
  privacy_level: "SELF_ONLY" # direct mode only: SELF_ONLY | PUBLIC_TO_EVERYONE | MUTUAL_FOLLOW_FRIENDS | FOLLOWER_OF_CREATOR
  # NOTE: TikTok forces SELF_ONLY in direct mode for unaudited apps regardless of this setting.
  # After the audit passes, switch mode to "direct" and privacy_level to PUBLIC_TO_EVERYONE.

# AI Configuration (Groq, free tier)
ai:
  text_model: "openai/gpt-oss-120b"

# Trending signal
keywords:
  max_trending: 10 # Google Trends rising/top related queries to feed the AI

# Safety limits
limits:
  max_uploads_per_run: 3

# Paths (relative to project root)
paths:
  state_file: "data/state.json"
  downloads_dir: "downloads"
